name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify packages without publishing
        type: boolean
        default: true
      skip_crates_io:
        description: Skip crates.io if this version was already published
        type: boolean
        default: false
      skip_pypi:
        description: Skip PyPI if this version was already published
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_HTTP_MULTIPLEXING: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require a matching version tag for publishing
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          if os.environ['DRY_RUN'] != 'true':
              if os.environ['GITHUB_REF_TYPE'] != 'tag':
                  raise SystemExit('Publishing requires a version tag; use dry_run on branches.')
              if os.environ['GITHUB_REF_NAME'] != f'v{version}':
                  raise SystemExit(f'Tag must match Cargo.toml: v{version}')
          print(f'Preparing uvlazy {version}')
          PY

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Wheel (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
            cross: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - uses: astral-sh/setup-uv@v10.0.1
        if: ${{ !matrix.cross }}
      - name: Test the wheel offline
        if: ${{ !matrix.cross }}
        env:
          UVLAZY_TEST_BINARY: .uvlazy/wheel-test/bin/uvlazy
          PYTHONPATH: src
        run: |
          uv venv --python 3.11 .uvlazy/wheel-test
          uv pip install --python .uvlazy/wheel-test/bin/python --no-index dist/*.whl
          .uvlazy/wheel-test/bin/python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: dtolnay/rust-toolchain@stable
      - run: uvx 'maturin>=1.8,<2' sdist --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Separate jobs let a failed registry publish be retried independently.
  publish-crates:
    name: Publish to crates.io
    needs: [build, sdist]
    if: ${{ inputs.skip_crates_io != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify publication (dry run)
        if: ${{ inputs.dry_run == true }}
        run: cargo publish --dry-run --locked
      - name: Publish
        if: ${{ inputs.dry_run != true }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  publish-pypi:
    name: Publish to PyPI
    needs: [build, sdist]
    if: ${{ inputs.dry_run != true && inputs.skip_pypi != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish artifacts/wheel-*/*.whl artifacts/sdist/*.tar.gz

  github-release:
    name: Create GitHub release
    needs: [build, sdist, publish-crates, publish-pypi]
    if: >-
      ${{ !cancelled() && inputs.dry_run != true &&
          needs.build.result == 'success' && needs.sdist.result == 'success' &&
          !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate package checksums
        working-directory: artifacts
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Run project-locked tools without installing the rest of the project.

            ```sh
            cargo install uvlazy --locked
            # or
            uv tool install uvlazy
            ```

            Then run `uvlazy run rumdl check .` in a project declaring rumdl in
            its dependencies and containing a current `uv.lock`.

            Experimental: requires uv 0.6.6+ and Python 3.11+ on macOS or Linux.
            The Rust executable bundles the Python engine. Lockfile exports
            constrain versions and sources but do not enforce artifact hashes.
            See the README for supported workflows and current limitations.
          files: |
            artifacts/*.whl
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
